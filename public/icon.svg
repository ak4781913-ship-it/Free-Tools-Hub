<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="512" height="512">
  <defs>
    <linearGradient id="brandGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#4338ca"/>
      <stop offset="50%" stop-color="#4f46e5"/>
      <stop offset="100%" stop-color="#7c3aed"/>
    </linearGradient>
    <linearGradient id="accentGrad" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#38bdf8"/>
      <stop offset="100%" stop-color="#818cf8"/>
    </linearGradient>
    <filter id="shadow" x="-10%" y="-10%" width="120%" height="120%">
      <feDropShadow dx="0" dy="16" stdDeviation="20" flood-color="#0f172a" flood-opacity="0.35"/>
    </filter>
  </defs>

  <!-- Background Base -->
  <rect width="512" height="512" rx="112" fill="url(#brandGrad)"/>
  
  <!-- Subtle Inner Border -->
  <rect x="16" y="16" width="480" height="480" rx="96" fill="none" stroke="rgba(255,255,255,0.18)" stroke-width="4"/>

  <!-- Logo Mark: Stylized FT -->
  <g filter="url(#shadow)" fill="#ffffff">
    <!-- F Stem -->
    <rect x="120" y="140" width="46" height="232" rx="14"/>
    <!-- F Top Bar -->
    <rect x="120" y="140" width="130" height="42" rx="14"/>
    <!-- F Mid Bar -->
    <rect x="120" y="235" width="105" height="38" rx="12"/>

    <!-- T Stem -->
    <rect x="330" y="140" width="46" height="232" rx="14"/>
    <!-- T Top Bar -->
    <rect x="260" y="140" width="186" height="42" rx="14"/>
  </g>

  <!-- VIP Badge Accent -->
  <g transform="translate(320, 310)">
    <rect width="112" height="44" rx="22" fill="url(#accentGrad)"/>
    <text x="56" y="28" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="20" font-weight="900" fill="#ffffff" text-anchor="middle" letter-spacing="2">HUB</text>
  </g>
</svg>
